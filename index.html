<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scaling Octo Journey | 无限尺度八爪深空跃迁</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐙</text></svg>" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="webgl-canvas"></canvas>
      
      <!-- Cyberpunk Deep-Space HUD Overlay -->
      <div class="hud-overlay">
        <!-- Top Navigation & Brand -->
        <header class="hud-header">
          <div class="hud-top-bar">
            <div class="hud-badge">CI/CD AUTONOMOUS ENGINE · V0.2.0 · LIVE</div>
            <div class="hud-actions-right">
              <button id="btn-sound" class="hud-pill-btn sound-btn" title="Toggle Procedural Audio [M]">
                <span class="icon">🔊</span>
                <span id="sound-label">AUDIO: OFF</span>
              </button>
              <div class="theme-picker" id="theme-picker">
                <button class="theme-dot dot-biolum active" data-theme="biolum" title="Bioluminescence"></button>
                <button class="theme-dot dot-singularity" data-theme="singularity" title="Singularity Void"></button>
                <button class="theme-dot dot-gold" data-theme="abyssalGold" title="Abyssal Gold"></button>
                <button class="theme-dot dot-solar" data-theme="solarPlasma" title="Solar Plasma"></button>
              </div>
            </div>
          </div>
          
          <div class="title-wrap">
            <h1 class="hud-title">SCALING OCTO JOURNEY</h1>
            <p class="hud-subtitle" id="biome-subtitle">深海渊裂 · 生物荧光黑潮 (10^1 m)</p>
          </div>

          <!-- Dimension Biome Selector -->
          <nav class="dimension-nav">
            <button class="dim-pill" data-biome="0">
              <span class="dim-num">01</span>
              <span class="dim-text">QUANTUM</span>
              <span class="dim-scale">10⁻¹⁵m</span>
            </button>
            <button class="dim-pill active" data-biome="1">
              <span class="dim-num">02</span>
              <span class="dim-text">ABYSSAL</span>
              <span class="dim-scale">10¹m</span>
            </button>
            <button class="dim-pill" data-biome="2">
              <span class="dim-num">03</span>
              <span class="dim-text">CYBER</span>
              <span class="dim-scale">10⁹m</span>
            </button>
            <button class="dim-pill" data-biome="3">
              <span class="dim-num">04</span>
              <span class="dim-text">COSMIC</span>
              <span class="dim-scale">10²⁴m</span>
            </button>
          </nav>
        </header>

        <!-- Center Interactive Core Trigger -->
        <div class="hud-center-status">
          <button class="status-core" id="btn-discharge" title="Click or Spacebar to Trigger Neural Pulse">
            <span class="pulse-dot"></span>
            <span class="status-text" id="status-label">NEURAL LINK ENGAGED · CLICK TO DISCHARGE</span>
          </button>
        </div>

        <!-- Bottom Telemetry & Controls Hint -->
        <footer class="hud-footer">
          <div class="telemetry-panel">
            <div class="telemetry-item">
              <span class="label">CURRENT SCALE</span>
              <span class="value" id="telemetry-scale">10<sup id="scale-exp">1</sup> m</span>
            </div>
            <div class="telemetry-item">
              <span class="label">NEURAL ARRAYS</span>
              <span class="value" id="telemetry-tentacles">8 / 8 ACTIVE</span>
            </div>
            <div class="telemetry-item">
              <span class="label">WARP FLUX</span>
              <span class="value" id="telemetry-fps">60 FPS</span>
            </div>
            <div class="telemetry-item">
              <span class="label">ACTIONS CI</span>
              <a href="https://github.com/lxm18-thursday/scaling-octo-journey/actions" target="_blank" rel="noopener noreferrer" class="value ci-good">RUN #1 PASS ✓</a>
            </div>
          </div>
          
          <div class="hud-controls-hint">
            <span class="key-badge">[Scroll / 1-4] Warp Scale</span>
            <span class="key-badge">[Drag] Cephalopod View</span>
            <span class="key-badge">[Space] Neural Pulse</span>
            <span class="key-badge">[M] Sound</span>
          </div>
        </footer>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
