name: Build & Package Scaling Octo Journey

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Build & Package Web Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck and Compile
        run: npm run build

      - name: Validate dist bundle
        run: |
          echo "=== Distribution Assets ==="
          ls -lh dist/
          ls -lh dist/assets/
          test -f dist/index.html || (echo "Missing dist/index.html!" && exit 1)

      - name: Create Release Zip Archive
        run: |
          cd dist
          zip -r ../scaling-octo-journey-bundle.zip .
          cd ..
          ls -lh scaling-octo-journey-bundle.zip

      - name: Upload Build Artifacts (Folder)
        uses: actions/upload-artifact@v4
        with:
          name: scaling-octo-journey-dist
          path: dist/
          retention-days: 14

      - name: Upload Release Zip Bundle
        uses: actions/upload-artifact@v4
        with:
          name: scaling-octo-journey-bundle-zip
          path: scaling-octo-journey-bundle.zip
          retention-days: 14
